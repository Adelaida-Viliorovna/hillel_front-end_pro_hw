<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>ToDo List</h1>
        <form id="todo-form" class="form">
            <input type="text" id="todo-input" placeholder="Enter a task" required class="form__input">
            <button type="submit" class="form__btn">Add</button>
        </form>
        <ul id="todo-list" class="js--todos-wrapper"></ul>
    </div>
    <script src="app.js"></script>
</body>

</html>
